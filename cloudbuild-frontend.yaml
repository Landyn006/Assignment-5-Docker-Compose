steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=https://recipe-backend-252661442872.us-east1.run.app'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recipe-frontend'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

options:
  logging: CLOUD_LOGGING_ONLY
